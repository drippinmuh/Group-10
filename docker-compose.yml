services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sfu_marketplace
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sfu_marketplace"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/sfu_marketplace
      DB_USERNAME: postgres
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
