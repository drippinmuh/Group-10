<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Conversation</title>
    <style>
        .chat {
            max-width: 720px;
        }
        .bubble {
            max-width: 75%;
            padding: 0.6rem 0.9rem;
            border-radius: 1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .bubble-mine {
            background: #0d6efd;
            color: #fff;
            border-bottom-right-radius: 0.25rem;
        }
        .bubble-theirs {
            background: #e9ecef;
            color: #212529;
            border-bottom-left-radius: 0.25rem;
        }
    </style>
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 chat">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <div class="bg-white rounded-4 shadow-sm p-3 mb-4">
            <div class="d-flex justify-content-between align-items-start gap-3">
                <div>
                    <div class="text-muted small">Conversation about</div>
                    <h1 class="h4 mb-1">
                        <a th:if="${conversation.listing.status.name() != 'REMOVED'}"
                           th:href="@{/listings/{id}(id=${conversation.listing.id})}"
                           th:text="${conversation.listing.title}" class="text-decoration-none">Listing</a>
                        <span th:if="${conversation.listing.status.name() == 'REMOVED'}"
                              th:text="${conversation.listing.title}">Listing</span>
                    </h1>
                    <div class="small text-muted">
                        with <span th:text="${otherParty.fullName}">Name</span>
                        (<span th:text="${otherParty.email}">email</span>)
                    </div>
                </div>
                <div class="text-end">
                    <div class="fw-semibold"
                         th:text="${conversation.listing.price == 0 ? 'Free' : '$' + conversation.listing.price}">$25</div>
                    <span th:if="${conversation.listing.status.name() == 'SOLD'}" class="badge bg-secondary">Sold</span>
                </div>
            </div>
            <div th:if="${conversation.listing.status.name() == 'REMOVED'}" class="alert alert-warning mt-3 mb-0 py-2">
                This listing has been removed.
            </div>
        </div>

        <div class="d-flex flex-column gap-3">
            <div th:each="m : ${messages}"
                 th:with="mine=${m.sender.email == currentUserEmail}"
                 th:class="${mine} ? 'd-flex flex-column align-items-end' : 'd-flex flex-column align-items-start'">
                <div class="small text-muted mb-1">
                    <span th:text="${mine} ? 'You' : ${m.sender.fullName}">Name</span>
                    &middot;
                    <span th:text="${timeFormat.format(m.sentAt)}">Nov 27, 6:31 PM</span>
                </div>
                <div th:class="${mine} ? 'bubble bubble-mine' : 'bubble bubble-theirs'"
                     th:text="${m.body}">Message text</div>
            </div>
        </div>

        <p class="small text-muted mt-4 mb-0">
            To send another message, use the "Message the seller" box on the listing page.
        </p>
    </div>

</body>
</html>
