<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Listings - SFU Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${#lists.isEmpty(listings)}" class="alert alert-info" role="alert">You haven't listed anything yet.</div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">My Listings</h1>
        <a href="/listings/new" class="btn btn-primary">Sell an Item</a>
    </div>

    <div th:if="${not #lists.isEmpty(listings)}" class="row">
        <div class="col-md-4 mb-4" th:each="listing : ${listings}">
            <div class="card h-100">
                <img th:if="${listing.imageUrl}" class="card-img-top" alt="Listing Image" th:src="${listing.imageUrl}">
                <div class="card-body">
                    <h5 class="card-title">
                        <span th:text="${listing.title}"></span>
                        <span th:if="${listing.status.name() == 'SOLD'}" class="badge bg-secondary">Sold</span>
                    </h5>
                    <p class="card-text" th:text="${listing.description}"></p>
                    <p class="card-text"><strong>Price:</strong> <span th:text="${listing.price == 0 ? 'Free' : '$' + listing.price}"></span></p>
                    <a th:href="@{/listings/{id}(id=${listing.id})}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
