<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SFU Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-5" style="max-width: 450px;">
    <h2>Login</h2>
    <p>Sign in to your SFU Marketplace account.</p>

    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created. You can now log in.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">SFU Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@sfu.ca" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="mt-3">Don't have an account? <a href="/register">Register here</a></p>
</div>

</body>
</html>
