<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - SFU Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-5" style="max-width: 450px;">
    <h2>Create an Account</h2>
    <p>Join SFU Marketplace.</p>

    <form>
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">SFU Email</label>
            <input type="email" class="form-control" id="email" placeholder="name@sfu.ca">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password">
        </div>

        <button type="button" class="btn btn-primary" disabled>Register</button>
    </form>

    <p class="mt-3">Already have an account? <a href="/login">Login here</a></p>
</div>

</body>
</html>
