
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listing Reports - SFU Marketplace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1>Listing Reports</h1>
    <p class="text-muted">
        Review and manage reports submitted by marketplace users.
    </p>

    <a href="/admin" class="btn btn-outline-secondary mb-4">
        Back to Dashboard
    </a>

    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${#lists.isEmpty(reports)}"
         class="alert alert-info">
        No reports have been submitted yet.
    </div>

    <div th:unless="${#lists.isEmpty(reports)}"
         class="table-responsive">

        <table class="table table-striped table-bordered align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Listing</th>
                <th>Reported By</th>
                <th>Reason</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="report : ${reports}">

                <td th:text="${report.id}"></td>

                <td>
                    <a th:if="${report.listing.status.name() != 'REMOVED'}"
                       th:href="@{/listings/{id}(id=${report.listing.id})}"
                       th:text="${report.listing.title}">
                    </a>

                    <span th:if="${report.listing.status.name() == 'REMOVED'}"
                          th:text="${report.listing.title + ' (Removed)'}">
                    </span>
                </td>

                <td th:text="${report.reporter.email}"></td>

                <td th:text="${report.reason}"></td>

                <td th:text="${report.createdAt}"></td>

                <td>
                    <span th:if="${report.status.name() == 'PENDING'}"
                          class="badge bg-warning text-dark">
                        Pending
                    </span>

                    <span th:if="${report.status.name() == 'RESOLVED'}"
                          class="badge bg-success">
                        Resolved
                    </span>
                </td>

                <td>
                    <form th:if="${report.status.name() == 'PENDING'}"
                          th:action="@{/admin/reports/{id}/resolve(id=${report.id})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-sm btn-success">
                            Resolve
                        </button>
                    </form>

                    <span th:if="${report.status.name() == 'RESOLVED'}"
                          class="text-muted">
                        Completed
                    </span>
                </td>

            </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
