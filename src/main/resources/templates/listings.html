<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listings - SFU Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-5">
    <h1>Listings</h1>
    <p>Browse items from other SFU students.</p>
    <form action="/listings" method="get" class="mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="keyword" class="form-label">Keyword</label>
                <input type="text" id="keyword" name="keyword" class="form-control"
                       placeholder="Search title or description" th:value="${keyword}">
            </div>
            <div class="col-md-6">
                <label for="category" class="form-label">Category</label>
                <input type="text" id="category" name="category" class="form-control"
                       placeholder="e.g. Textbooks" th:value="${category}">
            </div>
            <div class="col-md-3">
                <label for="condition" class="form-label">Condition</label>
                <input type="text" id="condition" name="condition" class="form-control"
                       placeholder="e.g. Good" th:value="${condition}">
            </div>
            <div class="col-md-3">
                <label for="campus" class="form-label">Campus</label>
                <input type="text" id="campus" name="campus" class="form-control"
                       placeholder="e.g. Burnaby" th:value="${campus}">
            </div>
            <div class="col-md-3">
                <label for="minPrice" class="form-label">Minimum price ($)</label>
                <input type="number" id="minPrice" name="minPrice" class="form-control"
                       min="0" step="0.01" th:value="${minPrice}">
            </div>
            <div class="col-md-3">
                <label for="maxPrice" class="form-label">Maximum price ($)</label>
                <input type="number" id="maxPrice" name="maxPrice" class="form-control"
                       min="0" step="0.01" th:value="${maxPrice}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Search</button>
                <a href="/listings" class="btn btn-outline-secondary">Clear filters</a>
            </div>
        </div>
    </form>
    <a th:if="${currentUserEmail != null}"
	href="/listings/new"
    	class="btn btn-primary mb-4">
    	Sell an Item
    </a>

    <div th:if="${not #lists.isEmpty(listings)}">
        <div class="row">
            <div class="col-md-4 mb-4" th:each="listing : ${listings}">
                <div class="card h-100">
                    <img th:if="${listing.imageUrl}" class="card-img-top" alt="Listing Image" th:src="${listing.imageUrl}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${listing.title}"></h5>
                        <p class="card-text" th:text="${listing.description}"></p>
                        <p class="card-text"><strong>Price:</strong> <span th:text="${listing.price == 0 ? 'Free' : '$' + listing.price}"></span></p>
                        <a th:href="@{/listings/{id}(id=${listing.id})}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<div th:unless="${not #lists.isEmpty(listings)}">
    <div class="alert alert-info mt-4" role="alert">
        No listings found. Try changing or clearing your filters.
    </div>
</div>

</body>
</html>
