<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listing Details</title>
</head>



<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <h1>Listing Details</h1>

    <div th:if="${currentUserEmail != null and currentUserEmail == listing.seller.email}" class="d-flex gap-2 mb-3">
        <a th:href="@{/listings/{id}/edit(id=${listing.id})}" class="btn btn-outline-primary">Edit</a>
        <form th:action="@{/listings/{id}/delete(id=${listing.id})}" method="post"
              onsubmit="return confirm('Delete this listing? This cannot be undone.');">
            <button type="submit" class="btn btn-outline-danger">Delete</button>
        </form>
    </div>

    <p>Title: <span th:text="${listing.title}"></span></p>
    <p>Description: <span th:text="${listing.description}"></span></p>
    <p>Price: <span th:text="${listing.price == 0 ? 'Free' : '$' + listing.price}"></span></p>
    <p>Category: <span th:text="${listing.category}"></span></p>
    <p>Condition: <span th:text="${listing.condition}"></span></p>
    <p>Campus: <span th:text="${listing.campus}"></span></p>
    <p>Seller: <span th:text="${listing.seller.email}"></span></p>
    <p>Created At: <span th:text="${#dates.format(listing.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    <div th:if="${listing.imageUrl}">
        <p>Image:</p>
	<img th:src="${listing.imageUrl}"
     		alt="Listing Image"
     		class="img-fluid rounded"
     		style="max-height: 400px; object-fit: contain;">
    </div>

    </div>

</body>
</html>
