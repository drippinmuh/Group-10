<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listing Details</title>
</head>



<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
    <h1>Listing Details</h1>

    <p>Title: <span th:text="${listing.title}"></span></p>
    <p>Description: <span th:text="${listing.description}"></span></p>
    <p>Price: <span th:text="${listing.price == 0 ? 'Free' : '$' + listing.price}"></span></p>
    <p>Category: <span th:text="${listing.category}"></span></p>
    <p>Condition: <span th:text="${listing.condition}"></span></p>
    <p>Campus: <span th:text="${listing.campus}"></span></p>
    <p>Seller: <span th:text="${listing.seller.email}"></span></p>
    <p>Created At: <span th:text="${#dates.format(listing.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    <div th:if="${listing.imageUrl}">
        <p>Image:</p>
	<img th:src="${listing.imageUrl}"
     		alt="Listing Image"
     		class="img-fluid rounded"
     		style="max-height: 400px; object-fit: contain;">
    </div>

    <div th:if="${currentUserEmail != null}" class="mt-3 mb-4">
        <form th:if="${!isFavourite}" th:action="@{/favourites/{id}(id=${listing.id})}" method="post">
            <button type="submit" class="btn btn-outline-danger">Add to Favourites</button>
        </form>
        <form th:if="${isFavourite}" th:action="@{/favourites/{id}/remove(id=${listing.id})}" method="post">
            <button type="submit" class="btn btn-danger">Remove from Favourites</button>
        </form>
    </div>

    </div>

</body>
</html>
