<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listing Details</title>
</head>



<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <h1>Listing Details</h1>

    <div th:if="${currentUserEmail != null and currentUserEmail == listing.seller.email}" class="d-flex gap-2 mb-3">
        <a th:href="@{/listings/{id}/edit(id=${listing.id})}" class="btn btn-outline-primary">Edit</a>
        <form th:action="@{/listings/{id}/delete(id=${listing.id})}" method="post"
              onsubmit="return confirm('Delete this listing? This cannot be undone.');">
            <button type="submit" class="btn btn-outline-danger">Delete</button>
        </form>
        <form th:action="@{/listings/{id}/update-status(id=${listing.id})}" method="post">
            <input type="hidden" name="status" th:value="${listing.status.name() == 'SOLD'} ? 'AVAILABLE' : 'SOLD'">
            <button type="submit" class="btn btn-outline-secondary" th:text="${listing.status.name() == 'SOLD'} ? 'Mark as Available' : 'Mark as Sold'"></button>
</form>
    </div>
    <div th:if="${isAdmin}" class="mb-3">
    <form th:action="@{/admin/listings/{id}/remove(id=${listing.id})}"
          method="post"
          onsubmit="return confirm('Remove this listing as an administrator? This cannot be undone.');">
        <button type="submit" class="btn btn-danger">
            Remove Listing (Admin)
        </button>
    </form>
</div>

    <p>Title: <span th:text="${listing.title}"></span></p>
    <span th:if="${listing.status.name() == 'SOLD'}" class="badge bg-secondary">Sold</span>
    <p>Description: <span th:text="${listing.description}"></span></p>
    <p>Price: <span th:text="${listing.price == 0 ? 'Free' : '$' + listing.price}"></span></p>
    <p>Category: <span th:text="${listing.category}"></span></p>
    <p>Condition: <span th:text="${listing.condition}"></span></p>
    <p>Campus: <span th:text="${listing.campus}"></span></p>
    <p>Seller: <span th:text="${listing.seller.email}"></span></p>
    <p>Created At: <span th:text="${#dates.format(listing.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    <div th:if="${listing.imageUrl}">
        <p>Image:</p>
	<img th:src="${listing.imageUrl}"
     		alt="Listing Image"
     		class="img-fluid rounded"
     		style="max-height: 400px; object-fit: contain;">
    </div>
        <div th:if="${currentUserEmail != null and currentUserEmail != listing.seller.email}"
         class="card mt-4 mb-3" style="max-width: 640px;">
        <div class="card-body">
            <h5 class="card-title">Message the seller</h5>
            <p th:if="${listing.status.name() == 'SOLD'}" class="text-muted mb-0">
                This item has been sold.
            </p>
            <form th:unless="${listing.status.name() == 'SOLD'}" th:action="@{/messages/contact}" method="post">
                <input type="hidden" name="listingId" th:value="${listing.id}">
                <div th:if="${contactError}" class="alert alert-danger py-2" th:text="${contactError}"></div>
                <label for="contactBody" class="visually-hidden">Message</label>
                <textarea id="contactBody" name="body" class="form-control mb-2" rows="3" maxlength="1000"
                          placeholder="Hi! Is this still available?" required
                          th:text="${contactBody}"></textarea>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>
    <p th:if="${currentUserEmail == null}" class="mt-4">
        <a href="/login">Log in</a> to message the seller.
    </p>
    <div th:if="${currentUserEmail != null}" class="mt-3 mb-4">
        <form th:if="${!isFavourite}" th:action="@{/favourites/{id}(id=${listing.id})}" method="post">
            <button type="submit" class="btn btn-outline-danger">Add to Favourites</button>
        </form>
        <form th:if="${isFavourite}" th:action="@{/favourites/{id}/remove(id=${listing.id})}" method="post">
            <button type="submit" class="btn btn-danger">Remove from Favourites</button>
        </form>
    </div>

    </div>

</body>
</html>
