<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${listingId != null} ? 'Edit Listing - SFU Marketplace' : 'Sell an Item - SFU Marketplace'">Sell an Item - SFU Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container mt-5" style="max-width: 600px;">
    <h2 th:text="${listingId != null} ? 'Edit Listing' : 'Sell an Item'">Sell an Item</h2>
    <p>Fill in the details of the item you want to sell. Enter a price of 0 to give it away for free.</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="${listingId != null} ? @{/listings/{id}/edit(id=${listingId})} : @{/listings}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" th:value="${title}"
                   maxlength="255" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4"
                      maxlength="1200" th:text="${description}" required></textarea>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price ($)</label>
            <input type="number" class="form-control" id="price" name="price" th:value="${price}"
                   min="0" max="1000000" step="0.01" required>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" th:value="${category}"
                   maxlength="255" placeholder="e.g. Textbooks, Electronics">
        </div>

        <div class="mb-3">
            <label for="condition" class="form-label">Condition</label>
            <input type="text" class="form-control" id="condition" name="condition" th:value="${condition}"
                   maxlength="255" placeholder="e.g. New, Good, Fair">
        </div>

        <div class="mb-3">
            <label for="campus" class="form-label">Campus</label>
            <input type="text" class="form-control" id="campus" name="campus" th:value="${campus}"
                   maxlength="255" placeholder="e.g. Burnaby, Surrey, Vancouver">
        </div>

        <div class="mb-3">
            <label for="imageUrl" class="form-label">Image URL (optional)</label>
            <input type="url" class="form-control" id="imageUrl" name="imageUrl" th:value="${imageUrl}"
                   maxlength="255" placeholder="https://...">
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${listingId != null} ? 'Save Changes' : 'Create Listing'">Create Listing</button>
        <a th:href="${listingId != null} ? @{/listings/{id}(id=${listingId})} : @{/listings}"
           class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
